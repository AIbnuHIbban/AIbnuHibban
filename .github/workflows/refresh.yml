name: Refresh numbers

on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate.mjs --live
      - name: Commit changes
        run: |
          git config user.name "Abdullah Ibnu Hibban"
          git config user.email "abd.ibnuhibban@gmail.com"
          git add README.md assets data
          git diff --cached --quiet || git commit -m "Refresh profile numbers"
          git pull --rebase
          git push
